name: SensorRead
options:
  bundleIdPrefix: com.sensorread
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: P95S5Q4QHB
targets:
  SensorRead:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    entitlements:
      path: Config/iOS.entitlements
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/iOS-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sensorread.ios
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SensorReadWatch
        embed: true
  SensorReadWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    entitlements:
      path: Config/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Watch-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sensorread.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.sensorread.ios
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
